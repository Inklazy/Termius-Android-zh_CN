name: Localize Android

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Rebuild current Google Play version (Artifact only, no Release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Serialize scheduled/manual runs, including publication, without canceling builds.
concurrency:
  group: android-google-play-release
  cancel-in-progress: false

jobs:
  localize:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source code from repository
        uses: actions/checkout@v5

      - name: Configure Python runtime environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "build-tools;35.0.0"
          export PATH="${ANDROID_HOME}/build-tools/35.0.0:$PATH"
          echo "${ANDROID_HOME}/build-tools/35.0.0" >> "$GITHUB_PATH"
          aapt version
          zipalign 2>&1 | head -n 1 || true
          apksigner version

      - name: Install apkeep
        shell: bash
        env:
          APKEEP_VERSION: '1.0.0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apkeep"
          URL="https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/apkeep-x86_64-unknown-linux-gnu"
          TARGET="$RUNNER_TEMP/apkeep/apkeep"
          downloaded=false
          for attempt in 1 2 3 4 5; do
            rm -f "$TARGET"
            echo "Downloading apkeep ${APKEEP_VERSION} (attempt ${attempt}/5)..."
            if curl \
                --fail \
                --location \
                --retry 3 \
                --retry-all-errors \
                --retry-delay 2 \
                --connect-timeout 20 \
                --max-time 180 \
                -o "$TARGET" \
                "$URL"; then
              downloaded=true
              break
            fi
            rm -f "$TARGET"
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to download apkeep ${APKEEP_VERSION} after 5 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

          if [ "$downloaded" != true ] || [ ! -s "$TARGET" ]; then
            echo "::error::Downloaded apkeep file is missing or empty: $TARGET"
            exit 1
          fi
          chmod +x "$TARGET"
          echo "$RUNNER_TEMP/apkeep" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/apkeep:$PATH"
          APKEEP_VERSION_OUTPUT="$("$TARGET" --version)"
          echo "$APKEEP_VERSION_OUTPUT"
          if ! printf '%s\n' "$APKEEP_VERSION_OUTPUT" | grep -Eq "(^|[^0-9])${APKEEP_VERSION}([^0-9]|$)"; then
            echo "::error::Downloaded apkeep version does not match ${APKEEP_VERSION}"
            exit 1
          fi
          apkeep --version
      - name: Install Python dependencies
        run: |
          cd android
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build localized Google Play APK
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
          GOOGLE_PLAY_EMAIL: ${{ secrets.GOOGLE_PLAY_EMAIL }}
          GOOGLE_PLAY_AAS_TOKEN: ${{ secrets.GOOGLE_PLAY_AAS_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          APK_SIGN_PROPERTIES: ${{ secrets.APK_SIGN_PROPERTIES }}
        run: |
          set -euo pipefail
          cd android

          if [ -z "$GOOGLE_PLAY_EMAIL" ]; then
            echo "::error::GOOGLE_PLAY_EMAIL secret is not configured"
            exit 1
          fi
          if [ -z "$GOOGLE_PLAY_AAS_TOKEN" ]; then
            echo "::error::GOOGLE_PLAY_AAS_TOKEN secret is not configured"
            exit 1
          fi

          if [ -n "$SIGNING_KEY" ]; then
            mkdir -p keystore
            echo "Decoding base64 signing key..."
            printf '%s' "$SIGNING_KEY" | base64 --decode > keystore/Termius_zh.jks
          fi
          printf '%s\n' "$APK_SIGN_PROPERTIES" > apk.sign.properties

          python release_android.py build

      - name: Upload Artifact
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Termius_v${{ steps.build.outputs.version_name }}
          path: android/out/${{ steps.build.outputs.asset }}
          if-no-files-found: error

      - name: Publish verified Android release
        if: steps.build.outputs.built == 'true' && steps.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python android/release_android.py publish
